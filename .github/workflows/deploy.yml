name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main # Thay đổi thành branch chính của bạn nếu cần
    paths:
      - "content/**"
      - "templates/**"
      - "generate.py"

  # Cho phép chạy thủ công từ giao diện Actions
  workflow_dispatch:

# Cấu hình quyền cho GITHUB_TOKEN
permissions:
  contents: write
  pages: write
  id-token: write

# Giới hạn chỉ một deployment chạy cùng lúc
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Job xây dựng trang web tĩnh
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # Bước 1: Checkout mã nguồn
      - name: Checkout repository
        uses: actions/checkout@v4

      # Bước 2: Cài đặt Python và các thư viện cần thiết
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12

      # Bước 3: Cài đặt các thư viện cần thiết
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install markdown python-frontmatter jinja2

      # Bước 4: Tạo site tĩnh
      - name: Generate static site
        run: python generate.py

      # Bước 5: Chuẩn bị cho GitHub Pages
      - name: Prepare for GitHub Pages
        run: mv .site docs # Đổi tên thư mục output sang docs

      # Bước 6: Upload artifact
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v2
        with:
          path: "docs/" # Đường dẫn đến thư mục chứa site tĩnh

      # Ghi chú: docs/ là thư mục mặc định cho GitHub Pages
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v3
