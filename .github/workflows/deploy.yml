name: Build and Deploy

on:
  push:
    branches: [ main ]
    # Theo dõi thay đổi đối với các file có thể ảnh hưởng đến website:
    paths:
      - '**/*.md'
      - generate.py
      - templates/**
      - static/**
      - requirements.txt

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Bước 1: Checkout mã nguồn
      - name: Checkout repository
        uses: actions/checkout@v3

      # Bước 2: Thiết lập môi trường Python
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'  # Hoặc phiên bản bạn muốn sử dụng

      # Bước 3: Cài đặt dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Bước 4: Build website tĩnh
      - name: Build static site
        run: |
          python generate.py

      # Bước 5: Deploy lên GitHub Pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./.site
